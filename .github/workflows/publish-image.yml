name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download river data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/public/data/nz web/public/data/au
          if ! gh release download data --repo "${{ github.repository }}" --dir web/public/data; then
            echo "Missing GitHub Release tag 'data' with New Zealand river files."
            echo "Create it from a machine that has the files (see README.md)."
            exit 1
          fi
          if [[ -f web/public/data/reaches.bin ]]; then
            mv web/public/data/reaches.bin web/public/data/nz/reaches.bin
          fi
          if [[ -f web/public/data/reaches.pmtiles ]]; then
            mv web/public/data/reaches.pmtiles web/public/data/nz/reaches.pmtiles
          fi
          if [[ -f web/public/data/names.bin ]]; then
            mv web/public/data/names.bin web/public/data/nz/names.bin
          fi
          for country in nz au; do
            for file in reaches.bin reaches.pmtiles names.bin; do
              if [[ -f "web/public/data/${country}-${file}" ]]; then
                mv "web/public/data/${country}-${file}" "web/public/data/${country}/${file}"
              fi
            done
          done
          test -s web/public/data/nz/reaches.bin
          test -s web/public/data/nz/reaches.pmtiles
          test -s web/public/data/nz/names.bin
          test -s web/public/data/au/reaches.bin
          test -s web/public/data/au/reaches.pmtiles
          test -s web/public/data/au/names.bin

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_COUNTRIES=nz,au
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
