server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/octet-stream application/json application/javascript text/css text/plain;
    gzip_proxied any;

    location ~* \.pmtiles$ {
        gzip off;
        add_header Accept-Ranges bytes;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
